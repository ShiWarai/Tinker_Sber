project:
  rte:
    base-dir: rte
  packs:
    - pack: Keil::ARM_Compiler@^1.6.3
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-FreeRTOS@^11.2.0
    - pack: Keil::STM32F4xx_DFP@^2.15.0
  setups:
    - setup: Options for TinkerFirmware
      processor:
        fpu: sp
      add-path:
        - include
        - include/app
        - include/drivers
        - include/system
        - include/sensors
        - include/math
        - rtos
        - build
        - lib/STM32F4xx_HAL_Driver/Inc
        - lib/STM32F4xx_HAL_Driver/Inc/Legacy
      debug: "on"
      define:
        - USE_HAL_DRIVER
        - STM32F405xx
        - __FPU_USED: 1U
        - __FPU_PRESENT: 1U
        - __MICROLIB
      define-asm:
        - __MICROLIB
      misc:
        - C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -w
          CPP:
            - -xc++
            - -std=c++11
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --library_type=microlib
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: F407_FC_TinkerFirmware.sct
  groups:
    - group: System
      misc:
        - CPP:
            - -xc++
            - -fno-exceptions
      files:
        - file: include/include.h
        - file: src/app/main.c
        - file: src/app/stm32f4xx_it.c
        - file: src/system/system_init.c
        - file: src/system/board_pins.c
    - group: Drivers
      files:
        - file: src/drivers/led.c
        - file: src/drivers/can.c
        - file: src/drivers/mit_protocol.c
        - file: src/drivers/beep.c
    - group: HAL
      files:
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_cortex.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_dma.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_flash.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_flash_ex.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_gpio.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_pwr.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_pwr_ex.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_rcc.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_rcc_ex.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_exti.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_can.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_spi.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_tim.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_tim_ex.c
        - file: lib/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_iwdg.c
  components:
    - component: Keil::Device:Startup
    - component: ARM::CMSIS:CORE
    - component: ARM::CMSIS:OS Tick:SysTick
    - component: ARM::CMSIS:RTOS2:FreeRTOS&Cortex-M
    - component: ARM::RTOS&FreeRTOS:Config&CMSIS RTOS2
    - component: ARM::RTOS&FreeRTOS:Core&Cortex-M
    - component: ARM::RTOS&FreeRTOS:Heap&Heap_4
    - component: ARM::RTOS&FreeRTOS:Event Groups
    - component: ARM::RTOS&FreeRTOS:Timers
    - component: Keil::Compiler&ARM Compiler:I/O:STDOUT&ITM
